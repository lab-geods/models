<!DOCTYPE html>

<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modelos 3D – Beja</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top left,#1d3557 0%,transparent 30%),
        radial-gradient(circle at bottom right,#457b9d 0%,transparent 30%),
        #0b0f14;

    color:white;
    min-height:100vh;
}

/* BOTÃO */

.top-bar{
    width:90%;
    max-width:1000px;
    margin:30px auto 0;
}

.back-button{
    display:inline-block;

    padding:12px 24px;

    border-radius:12px;

    text-decoration:none;

    color:white;

    font-weight:600;

    background:linear-gradient(135deg,#2196f3,#21cbf3);

    box-shadow:0 0 15px rgba(33,203,243,.4);

    transition:.3s ease;
}

.back-button:hover{
    transform:scale(1.05);

    box-shadow:
        0 0 25px rgba(33,203,243,.8);
}

/* TÍTULOS */

h1{
    text-align:center;
    font-size:52px;
    font-weight:700;
    margin:30px 0 50px;
}

h2{
    text-align:center;
    font-size:28px;
    font-weight:600;
    margin:45px 0 20px;
}

/* VIEWERS */

.viewer-container{
    position:relative;

    width:90%;
    max-width:1000px;

    margin:0 auto 50px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(12px);

    border-radius:22px;

    overflow:hidden;

    transition:.35s ease;

    box-shadow:
        0 0 20px rgba(0,0,0,0.35);

    padding:20px;
}

.viewer-container::before{
    content:'';

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            transparent
        );

    pointer-events:none;
}

.viewer-container:hover{
    transform:translateY(-8px);

    border-color:#64b5f6;

    box-shadow:
        0 0 25px rgba(100,181,246,0.35),
        0 0 60px rgba(100,181,246,0.15);
}

iframe{
    width:100%;
    height:600px;
    border:none;
    border-radius:15px;
}

@media(max-width:700px){
    h1{
        font-size:36px;
        margin:30px 0 35px;
    }

    h2{
        font-size:22px;
    }

    iframe{
        height:420px;
    }
}

</style>

</head>

<body>

<div class="top-bar">
    <a href="patrimonio.html" class="back-button">
        ← Voltar ao Início
    </a>
</div>

<h1>Modelos 3D – Beja</h1>

<h2>Villa Romana de Pisões</h2>

<div class="viewer-container">
    <iframe
        title="Villa Romana de Pisões"
        frameborder="0"
        allowfullscreen="true"
        mozallowfullscreen="true"
        webkitallowfullscreen="true"
        src="https://realitymax.co/embed/V6DR7P">
    </iframe>
</div>

</body>
</html>
